[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Archivos SEO: Content-Type correcto (Vite los copia desde public/ a dist/)
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Canónica: / → /home (evita duplicar la home nacional en GSC)
[[redirects]]
  from = "/"
  to = "/home"
  status = 301

# React Router (SPA): rutas sin HTML estático → index.html
# Las rutas SEO prerenderizadas viven en dist/<ruta>/index.html y tienen prioridad.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
